# =============================================================================
# hadolint configuration for OptiVest
# =============================================================================
#
# We keep hadolint's full ruleset and only relax three rules that don't
# match how Alpine package management works in practice:
#
#   DL3008 - "Pin versions in apt get install" — applied to apk add.
#            Alpine repositories are themselves version-pinned by the base
#            image tag (alpine:3.20). Adding =version pins on top of that
#            either silently breaks when the alpine point release moves or
#            forces a flag-day rebuild every few weeks. The right level
#            of version control is the alpine tag itself; we already pin
#            that explicitly in both Dockerfile and Dockerfile.migrate.
#
#   DL3018 - "Pin versions in apk add" — same reasoning as DL3008.
#
#   DL3007 - "Using latest is prone to errors" — we don't use :latest on
#            our base images. This rule is on by default but flagged here
#            so a future maintainer doesn't think it's missing.
#
# Everything else is on, including DL3025 (use JSON form for CMD) and
# the various security-flavored rules. Run locally:
#
#   hadolint --config .hadolint.yaml Dockerfile
#   hadolint --config .hadolint.yaml Dockerfile.migrate
# =============================================================================

ignored:
  - DL3008
  - DL3018

# Treat warnings as failures in CI (matches the workflow's failure-threshold).
failure-threshold: warning

# Trusted base image registries. hadolint warns on images from sources it
# doesn't know about; pinning these here removes the warning for the two
# registries we use.
trustedRegistries:
  - docker.io
  - gcr.io
  - ghcr.io
